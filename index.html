<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>누르는 버튼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one control panel plate — the button sits in a recessed bay on top, settings on a strip below. */
:root {
  --bg: #e4e6e8;          /* panel steel */
  --plate: #f3f4f5;       /* raised plate */
  --bay: #c9ccd1;         /* recessed bay around the button */
  --ink: #1d2126;
  --muted: #5d6570;
  --line: #cfd3d8;
  --focus: #2563eb;

  --font-display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  /* fixed button geometry */
  --btn-w: 300px;
  --btn-h: 170px;
  --travel: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181c; --plate: #1f242a; --bay: #0d0f12; --ink: #e8eaed;
    --muted: #9aa3ad; --line: #2e353d; --focus: #7aa7ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181c; --plate: #1f242a; --bay: #0d0f12; --ink: #e8eaed;
  --muted: #9aa3ad; --line: #2e353d; --focus: #7aa7ff; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--font-body);
  padding-block: 32px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.panel {
  max-width: 560px;
  margin: 0 auto;
  background: var(--plate);
  border: 1px solid var(--line);
  border-radius: 18px;
  display: grid;
  overflow: hidden;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 18px 22px 0;
}
h1 {
  margin: 0;
  font: 22px/1.2 var(--font-display);
  letter-spacing: 0.02em;
  text-wrap: balance;
}
.counter {
  font: 500 13px var(--font-mono);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.counter b { color: var(--ink); font-weight: 500; }

/* ---------- the button ---------- */
.bay {
  margin: 18px 22px 0;
  padding: 36px 16px 40px;
  background: var(--bay);
  border-radius: 14px;
  box-shadow: inset 0 3px 8px rgb(0 0 0 / 0.22);
  display: grid;
  place-items: center;
}
.press {
  --c: #e8443a;           /* face color, set from JS */
  --c-side: #a32a22;      /* derived darker side */
  --label: #ffffff;
  position: relative;
  width: min(var(--btn-w), 100%);
  height: var(--btn-h);
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
.press::before {           /* the housing the cap travels into */
  content: "";
  position: absolute;
  inset: var(--travel) 0 calc(var(--travel) * -1);
  border-radius: 22px;
  background: var(--c-side);
  box-shadow: 0 10px 18px rgb(0 0 0 / 0.28);
}
.cap {
  position: absolute;
  inset: 0;
  border-radius: 22px;
  background:
    linear-gradient(180deg, rgb(255 255 255 / 0.28), rgb(255 255 255 / 0) 45%),
    var(--c);
  box-shadow: inset 0 -3px 0 rgb(0 0 0 / 0.12), inset 0 2px 0 rgb(255 255 255 / 0.35);
  display: grid;
  place-items: center;
  overflow: hidden;
  transform: translateY(0);
  transition: transform 140ms cubic-bezier(.3, 1.6, .5, 1), filter 140ms;
}
.label {
  display: block;
  max-width: calc(100% - 28px);
  color: var(--label);
  font-family: var(--font-display);
  line-height: 1;
  white-space: nowrap;
  text-shadow: 0 1px 0 rgb(0 0 0 / 0.18);
  transition: font-size 120ms ease-out;
}
.press.is-down .cap {
  transform: translateY(calc(var(--travel) - 2px));
  filter: brightness(0.93);
  transition: transform 45ms ease-out, filter 45ms;
}
.ripple {
  position: absolute;
  width: 20px; height: 20px;
  margin: -10px 0 0 -10px;
  border-radius: 50%;
  background: rgb(255 255 255 / 0.45);
  pointer-events: none;
  animation: ripple 520ms ease-out forwards;
}
@keyframes ripple { to { transform: scale(22); opacity: 0; } }
.press:focus-visible { outline: none; }
.press:focus-visible .cap { outline: 3px solid var(--focus); outline-offset: 4px; }

/* ---------- controls ---------- */
.controls {
  display: grid;
  gap: 18px;
  padding: 22px;
}
.field { display: grid; gap: 6px; min-width: 0; }
.field-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
label, .field-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--muted);
}
input[type="text"] {
  width: 100%;
  font: 16px var(--font-body);
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
}
input[type="text"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

.readout {
  font: 12px var(--font-mono);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.readout b { color: var(--ink); font-weight: 500; }

.swatches { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.swatch {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid var(--plate);
  box-shadow: 0 0 0 1px var(--line);
  background: var(--sw);
  cursor: pointer;
  padding: 0;
}
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.swatch:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.picker {
  position: relative;
  display: inline-flex; align-items: center; gap: 8px;
  font: 12px var(--font-mono);
  color: var(--muted);
}
input[type="color"] {
  width: 36px; height: 36px;
  border: 1px solid var(--line);
  border-radius: 50%;
  padding: 0;
  background: none;
  cursor: pointer;
}
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
input[type="color"]::-moz-color-swatch { border: none; border-radius: 50%; }

.toggles { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); letter-spacing: 0; font-weight: 400; cursor: pointer; }
.toggle input { width: 16px; height: 16px; accent-color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  .cap, .press.is-down .cap, .label { transition: none; }
  .ripple { display: none; }
}
@media (max-width: 420px) {
  :root { --btn-h: 150px; }
  header, .controls { padding-left: 16px; padding-right: 16px; }
  .bay { margin-left: 16px; margin-right: 16px; }
}
</style>
</head>
<body>
<main class="panel">
  <header>
    <h1>누르는 버튼</h1>
    <span class="counter" aria-live="polite">누른 횟수 <b id="count">0</b></span>
  </header>

  <div class="bay">
    <button class="press" id="press" type="button">
      <span class="cap"><span class="label" id="label">눌러 보세요</span></span>
    </button>
  </div>

  <section class="controls">
    <div class="field">
      <div class="field-head">
        <label for="text">버튼 문구</label>
        <span class="readout" id="readout"></span>
      </div>
      <input type="text" id="text" value="눌러 보세요" maxlength="60" autocomplete="off">
    </div>

    <div class="field">
      <span class="field-title" id="color-title">버튼 색상</span>
      <div class="swatches" role="group" aria-labelledby="color-title" id="swatches">
        <label class="picker" for="color" title="직접 고르기">
          <input type="color" id="color" value="#e8443a">
          <span id="hex">#E8443A</span>
        </label>
      </div>
    </div>

    <div class="toggles">
      <label class="toggle" for="sound"><input type="checkbox" id="sound" checked> 클릭 소리</label>
      <label class="toggle" for="buzz"><input type="checkbox" id="buzz" checked> 진동 (지원 기기)</label>
    </div>
  </section>
</main>

<script>
(() => {
  // Font size = K ÷ (글자 수). K is the usable label width, so a full-width Hangul string just fits the button.
  let K = 250;
  const MAX_PX = 120;   // a single character would otherwise be 250px, taller than the button
  const MIN_PX = 4;

  const PRESETS = ["#e8443a", "#f59e0b", "#22a35a", "#1f7ae0", "#7c4ddb", "#e14b9b", "#2b2f36"];

  const $ = (id) => document.getElementById(id);
  const btn = $("press"), label = $("label"), text = $("text"), color = $("color");
  const hex = $("hex"), readout = $("readout"), countEl = $("count"), swatchBox = $("swatches");
  const sound = $("sound"), buzz = $("buzz");

  const store = {
    get(k, d) { try { const v = localStorage.getItem("press:" + k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("press:" + k, v); } catch {} },
  };

  // ---- color helpers ----
  const toRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const toHex = (rgb) => "#" + rgb.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("");
  const darken = (h, f) => toHex(toRgb(h).map((v) => v * f));
  const luminance = (h) => {
    const [r, g, b] = toRgb(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };

  function setColor(h) {
    h = h.toLowerCase();
    btn.style.setProperty("--c", h);
    btn.style.setProperty("--c-side", darken(h, 0.62));
    btn.style.setProperty("--label", luminance(h) > 0.45 ? "#1d2126" : "#ffffff");
    color.value = h;
    hex.textContent = h.toUpperCase();
    swatchBox.querySelectorAll(".swatch").forEach((s) => s.setAttribute("aria-pressed", String(s.dataset.c === h)));
    store.set("color", h);
  }

  PRESETS.forEach((c) => {
    const s = document.createElement("button");
    s.type = "button";
    s.className = "swatch";
    s.dataset.c = c;
    s.style.setProperty("--sw", c);
    s.setAttribute("aria-label", "색상 " + c.toUpperCase());
    s.addEventListener("click", () => setColor(c));
    swatchBox.insertBefore(s, swatchBox.lastElementChild);
  });
  color.addEventListener("input", () => setColor(color.value));

  // ---- text & inverse-proportional font size ----
  function setText(t) {
    K = Math.round(btn.clientWidth - 50);
    const shown = t.trim() === "" ? "" : t;
    const len = Math.max(1, Array.from(shown).length);   // count characters, not UTF-16 units
    const raw = K / len;
    const px = Math.max(MIN_PX, Math.min(MAX_PX, raw));
    label.textContent = shown || " ";
    label.style.fontSize = px.toFixed(2) + "px";
    btn.setAttribute("aria-label", shown || "빈 버튼");
    readout.innerHTML = `${len}자 · <b>${px.toFixed(1)}px</b> = ${K} ÷ ${len}` + (raw > MAX_PX ? " (최대 " + MAX_PX + ")" : "");
    store.set("text", t);
  }
  text.addEventListener("input", () => setText(text.value));
  window.addEventListener("resize", () => setText(text.value));

  // ---- press feedback ----
  let audio;
  function click(down) {
    if (!sound.checked) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime;
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "square";
      o.frequency.setValueAtTime(down ? 190 : 320, t);
      o.frequency.exponentialRampToValueAtTime(down ? 70 : 140, t + 0.05);
      g.gain.setValueAtTime(down ? 0.18 : 0.08, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + 0.08);
    } catch {}
  }

  let count = parseInt(store.get("count", "0"), 10) || 0;
  countEl.textContent = count;

  function down(x, y) {
    if (btn.classList.contains("is-down")) return;
    btn.classList.add("is-down");
    click(true);
    if (buzz.checked && navigator.vibrate) { try { navigator.vibrate(12); } catch {} }
    const cap = btn.querySelector(".cap");
    const r = cap.getBoundingClientRect();
    const dot = document.createElement("span");
    dot.className = "ripple";
    dot.style.left = (x ?? r.left + r.width / 2) - r.left + "px";
    dot.style.top = (y ?? r.top + r.height / 2) - r.top + "px";
    cap.appendChild(dot);
    dot.addEventListener("animationend", () => dot.remove());
  }
  function up(commit) {
    if (!btn.classList.contains("is-down")) return;
    btn.classList.remove("is-down");
    click(false);
    if (commit) {
      count += 1;
      countEl.textContent = count;
      store.set("count", String(count));
    }
  }

  btn.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    btn.setPointerCapture(e.pointerId);
    down(e.clientX, e.clientY);
  });
  btn.addEventListener("pointerup", (e) => {
    const r = btn.getBoundingClientRect();
    const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom + 12;
    up(inside);   // dragging off the button before releasing cancels the press, like a real button
  });
  btn.addEventListener("pointercancel", () => up(false));
  btn.addEventListener("keydown", (e) => {
    if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); down(); }
  });
  btn.addEventListener("keyup", (e) => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); up(true); }
  });
  btn.addEventListener("blur", () => up(false));

  // ---- restore ----
  text.value = store.get("text", text.value);
  setText(text.value);
  const saved = store.get("color", PRESETS[0]);
  setColor(/^#[0-9a-f]{6}$/i.test(saved) ? saved : PRESETS[0]);
})();
</script>
</body>
</html>
